; MeshRoute — C++ port of the dv_dual_sf LoRa-mesh protocol.
;
; Spec of record: spec/dv_dual_sf.lua (symlinked to
; /home/staszek/lora-universal-simulator/scenarios/dv_dual_sf.lua).
; Touching protocol constants is a wire change — rebuild the suite.
;
; RF plan (memory: project-band-choice):
;   869.4625 MHz / SF8 / BW125 / CR4/5 / 10% duty / EU868 g3 sub-band.
; NB: freq/BW/SF are RUNTIME node config (the protocol retunes SF live); the
; LORA_* macros below are only the std_init() bring-up defaults + banner prints.
; Units match CustomSX1262::std_init: LORA_FREQ in MHz, LORA_BW in kHz.
;
; Envs:
;   native        — host build for tests + sim driver (no radio)
;   xiao_sx1262   — Seeed XIAO nRF52840 + Wio-SX1262 shield (primary target)
;   heltec_v3     — ESP32-S3 Heltec WiFi LoRa 32 V3 (backup target)
;   heltec_v4     — ESP32-S3 Heltec WiFi LoRa 32 V4.2/V4.3 (runtime-detected external FEM)

[platformio]
default_envs = native

; ----- Shared compile flags + LoRa plan -----
[common]
build_flags =
  -std=gnu++2a                ; = C++20. Use the gnu++2a spelling (not gnu++20): GCC<10 (shipped by some
                              ; PlatformIO ESP32/xtensa installs) only knows gnu++2a; GCC 8..13+ all accept it.
  -Wall -Wextra
  ; ★ -Werror=switch — owner ruling 2026-07-27. -Wswitch (inside -Wall) only WARNS, so the build succeeds and
  ; enforcement degrades to "a human reads the warning census". Five defects of exactly this class shipped in
  ; July (`> gateway err ok`; six unhandled PushKinds; the sim oracle folding 10 of 14 kinds into send_failed;
  ; three enum->string holes). A number in a doc erodes; a build failure cannot. NB this is `switch`, not
  ; `switch-enum`: a `default:` label still silences it — which is why several of our dispatch switches
  ; deliberately have NO default (see node.cpp on_recv / node_mac.cpp label_of_frame, §w4-switchenum).
  ;
  ; BLANKET, not build_src_flags / per-library, and that is a MEASURED call, not an assumption: build_flags DO
  ; propagate into the framework + vendored compiles (same mechanism as -DLFS_NO_ASSERT below), so the census
  ; of a full clean build already covers every third-party TU we compile. Measured 2026-07-27 on all 10 board
  ; envs + native, from the real pio logs: -Wswitch count is ZERO everywhere — across libFrameworkArduino,
  ; libRadioLib, libBluefruit52Lib, libAdafruit_*, libCustomLFS, libInternalFileSytem, lib/meshcore and
  ; lib/monocypher, as well as libcore/libconsole/libhal and src/. (xiao_sx1262 alone emits 18.6k warnings of
  ; OTHER classes — 18192 -Wunused-parameter from the BSP — so the flags demonstrably do reach that code.)
  ; ⇒ a blanket flag covers ALL of lib/core + lib/console + lib/hal + src/ + test/ in every env, in one line,
  ; and stays covered when a new lib/ directory is added — which the per-library alternative would not.
  ; RESIDUAL RISK + THE LEVER: every platform/toolchain/lib_deps version here is pinned EXACTLY, so nothing
  ; third-party moves without a deliberate bump. If a future bump does introduce an unhandled-enum switch in
  ; code we may not edit (vendoring policy), do NOT patch theirs — scope ours instead: drop this line and put
  ; `-Werror=switch` in each of lib/{core,console,hal}/library.json `build.flags` + a `build_src_flags` here.
  -Werror=switch
  -fno-exceptions
  -fno-rtti
  -DMR_RADIO_CANARY=1
  -DPROTOCOL_VERSION=1
  -DMR_CONSOLE=1              ; USB-CDC console (2026-06-25): 1 = dev/bench (the harness drives the node over USB).
                              ; A `production` env sets -DMR_CONSOLE=0 -> mrcon is a NullPrint + the input path #if's out
                              ; -> NO USB console (BLE-NUS + `rcmd` + the fault-log are the production diagnostics path).
  -DLORA_FREQ=869.4625        ; MHz  — std_init begin() + banners
  -DLORA_BW=125.0             ; kHz  — std_init begin()
  -DLORA_SF=8
  -DLORA_CR=5
  -DLORA_TX_POWER=22          ; dBm  — std_init begin() (cap to g3 ERP limit)
  -DLORA_PREAMBLE_SYM=16
  -DLORA_DUTY_CYCLE_PCT=10

; ----- Native host build (tests + sim driver) -----
[env:native]
platform = native
build_type = debug
; Host compiles go through ccache (Debian masquerade dir, native-only, fail-open
; when absent) — see tools/ccache_native.py for the full rationale.
extra_scripts = pre:tools/ccache_native.py
test_framework = doctest
; Tests link lib/core + lib/hal (codecs, airtime, constants) — they don't need
; src/. Building src/ into the test program would drag sim_main.cpp's main() in
; and clash with the doctest runner's main. `pio run -e native` still builds the
; sim driver (test_build_src affects test builds only).
test_build_src = no
build_src_filter = +<sim_main.cpp> -<fw_main.cpp>
; The vendored MeshCore PHY header pulls <RadioLib.h>, which has no native
; backend — keep it out of the host build entirely.
lib_ignore = meshcore
build_flags =
  ${common.build_flags}
  -DMESHROUTE_NATIVE=1
  -DMR_N_LAYERS=2               ; the host test env exercises BOTH single- AND dual-layer logic, so it
                               ; allocates 2 LayerRuntimes (host RAM is free). Keeps the _layers[] array at
                               ; size 2 = byte-identical to the pre-RAM-fix Slice-2a binary (the no-op proof).
  -I src                       ; §cleanup 2026-07-14: header path so native tests reach PURE src/ units (firmware_config_parse.h). Adds the include dir ONLY — src/*.cpp stay uncompiled (test_build_src=no), so sim_main.cpp's main() is not dragged in.
  -g -O0
lib_deps =
  doctest/doctest @ ^2.4.11

; ----- Seeed XIAO nRF52840 + Wio-SX1262 (primary) -----
[env:xiao_sx1262]
; PIN the platform version (was unpinned) so every machine resolves the SAME builder + default
; toolchain. A newer nordicnrf52 ships GCC 13/14, where the SoftDevice SVCALL macro (a naked
; function with EXTENDED inline asm) is a HARD ERROR (hundreds of nrf_svc.h failures); the pinned
; GCC 12.3.1 below still allows it. 10.11.0 is the version verified to build the XIAO here.
platform = nordicnrf52 @ 10.11.0
; Custom board def vendored from MeshCore into boards/ (Adafruit nRF52 core,
; S140 v7.3.0) — the stock `xiao_ble_sense` id does not exist.
board = seeed-xiao-afruitnrf52-nrf52840
board_build.ldscript = boards/nrf52840_s140_v7.ld
framework = arduino
; lib/hal (timer_wheel/device_hal/iradio) #include "hal.h" from lib/core (MeshRouteCore). The default
; `chain` LDF does not reliably add lib/core to lib/hal's include path on every OS (works on Linux, FAILS
; on Windows -> 'TxResult does not name a type'). deep+ scans all libs + evaluates #if so the cross-lib
; dependency is always resolved (+ lib/hal/library.json declares it explicitly).
lib_ldf_mode = deep+
; Emit firmware.uf2 (the nrfutil build only makes .hex/.zip). Drop the .uf2 onto the XIAO-SENSE
; bootloader drive (double-tap RESET) — the no-COM-port first-flash path. See tools/uf2_postbuild.py.
extra_scripts =
  pre:tools/git_rev.py          ; inject -DGIT_REV for the `version` banner (gateway inherits this via extends)
  post:tools/uf2_postbuild.py
; The stock nordicnrf52 toolchain is GCC 7.2.1 — too old for C++20 (lib/core
; uses <span>). Bump to GCC 12.3 so the shared core compiles for ARM too.
platform_packages =
  framework-arduinoadafruitnrf52 @ 1.10700.0
  platformio/toolchain-gccarmnoneeabi @ 1.120301.0
; The BSP has no Seeed XIAO variant — compile our vendored variant.cpp (defines
; g_ADigitalPinMap) alongside the firmware source.
build_src_filter = +<fw_main.cpp> +<firmware_remote.cpp> +<firmware_config.cpp> +<firmware_inbox.cpp> +<firmware_commands.cpp> -<sim_main.cpp> +<../variants/Seeed_XIAO_nRF52840/variant.cpp>
upload_protocol = nrfutil
; The firmware runs Serial at 115200 (fw_main: Serial.begin(115200)); without this, `pio device
; monitor` opens at 9600 and the console looks empty/garbled.
monitor_speed = 115200
debug_tool = cmsis-dap
debug_init_break = tbreak setup
; The Adafruit nRF52 builder appends -std=gnu++11 last on our TUs, overriding
; the common -std=gnu++2a (lib/core needs C++14+ constexpr / C++20 <span>).
; Strip it so our gnu++2a wins; framework libs keep their own gnu++17.
build_unflags = -std=gnu++11
build_flags =
  ${common.build_flags}
  -DMESHROUTE_NO_TELEMETRY        ; strip the diagnostic emit blocks (MR_TELEMETRY) from the device build
  -DRADIOLIB_GODMODE=1
  -DRADIOLIB_STATIC_ONLY=1
  -DNRF52_PLATFORM
  -DBOARD_XIAO_WIO_SX1262
  ; The Adafruit BSP ships no Seeed XIAO variant; we vendor it. Put it on the
  ; GLOBAL include path so framework libs (Uart.h -> variant.h) resolve it too.
  -I variants/Seeed_XIAO_nRF52840
  ; Belt-and-suspenders with lib_ldf_mode=deep+ : force lib/core onto the global
  ; include path so lib/hal's #include "hal.h" always resolves (the Windows failure).
  -I lib/core
  ; control pins -> RadioLib Module(NSS, DIO1, RST, BUSY) ctor (D-aliases)
  -DLORA_PIN_NSS=D4
  -DLORA_PIN_DIO1=D1
  -DLORA_PIN_RST=D2
  -DLORA_PIN_BUSY=D3
  ; board/analog wiring -> read by CustomSX1262::std_init
  -DSX126X_RXEN=D5
  -DSX126X_TXEN=RADIOLIB_NC
  -DSX126X_DIO2_AS_RF_SWITCH=1
  -DSX126X_DIO3_TCXO_VOLTAGE=1.8
  -DSX126X_CURRENT_LIMIT=140
  -DSX126X_RX_BOOSTED_GAIN=1
  ; ---- build-neutral RAM/size switches (2026-06-12 RAM review) ----
  -Wl,-Map=firmware.map            ; emit a link map so memory reviews are EXACT (not struct arithmetic)
  ; compile out the unused TinyUSB device classes — this device is CDC-only (frees ~3 KB RAM IF the BSP
  ; honors the -D; confirm against the map — if overridden, switch to a user tusb_config.h).
  -DCFG_TUD_MSC=0
  -DCFG_TUD_HID=0
  -DCFG_TUD_MIDI=0
  -DCFG_TUD_VENDOR=0
  -DCFG_TUD_VIDEO=0
  ; USB-CDC reliability (2026-06-25 Part 4): bump the CDC FIFOs from the ~256 B default so an output BURST is
  ; absorbed (TX) and a long `testsend … -t …` arm line buffers without the host outrunning Serial.read (RX). ~1.5 KB
  ; RAM, trivially affordable. (Moot under the production -DCFG_TUD_CDC=0 build, which excludes the CDC class entirely.)
  -DCFG_TUD_CDC_TX_BUFSIZE=1024
  -DCFG_TUD_CDC_RX_BUFSIZE=1024
  ; QSPI inbox-records backend (CustomLFS_QSPIFlash on the XIAO's 2 MB P25Q16H). QSPIFLASH gates the inbox
  ; records FS + MRINBOX_QSPI_READY (device_inbox_store.h); NRFX_QSPI_ENABLED pulls in the nrfx_qspi driver.
  ; NOT EXTRAFS — records are on the SEPARATE QSPI chip, so the on-chip InternalFS (device_nv + inbox meta)
  ; keeps the current ld (nrf52840_s140_v7.ld) untouched. (Adopt the extrafs ld only if begin() needs it.)
  -D QSPIFLASH=1
  -D NRFX_QSPI_ENABLED=1
  ; InternalFS self-heal (Part 1, 2026-06-24): compile out the Adafruit_LittleFS asserts so a corrupt CTZ
  ; block (a reset-during-write) RETURNS LFS_ERR_CORRUPT instead of assert()-HALTING the node at boot
  ; (lfs.c:1144 "head >= 2 && head <= block_count"). The error then lets mount_or_repair() reformat + boot.
  ; PlatformIO build_flags propagate to the framework-lib compile, so this reaches lfs.c (the gateway env
  ; inherits it via ${env:xiao_sx1262.build_flags}). NB the ESP32 envs use NVS, not LittleFS -> N/A there.
  -DLFS_NO_ASSERT
lib_deps =
  jgromes/RadioLib @ 7.7.1     ; ★ PINNED EXACTLY (2026-07-26 ruling), was ^7.6.0. The caret let different
                               ; checkouts resolve different versions — this tree held a MIX (7.7.1 on 9 envs,
                               ; 7.7.0 on xiao_sx1262/heltec_v3/native), which silently skews any board
                               ; RAM/Flash baseline and invalidated one during the 3-B dedup block. 7.7.1 is
                               ; what the majority of envs and all recent gating/bench work already ran, so this
                               ; freezes proven ground rather than moving to it; it also keeps the newer
                               ; LR1110 support that the T1000-E variant will need. Bump deliberately, never
                               ; by resolution drift.
  ; inbox device store — external QSPI records FS. CustomLFS_QSPIFlash (oltaco/CustomLFS) is an Adafruit_LittleFS
  ; subclass driving nrfx_qspi directly (no Adafruit_SPIFlash / SdFat -> no TinyUSB SS/File clash); its JEDEC
  ; table already covers the XIAO's P25Q16H. (The naive SPIFlash+SdFat path is a DEAD-END here — do not retry.)
  https://github.com/oltaco/CustomLFS @ 0.2.1

; ----- Heltec WiFi LoRa 32 V3 (backup) -----
[env:heltec_v3]
; PIN the platform (was unpinned) so every machine resolves the SAME builder + toolchain — the same
; <span> story as the nRF52 above. The official `espressif32` ships GCC 8.4 (xtensa): too old for
; C++20 — no <span> header, and it rejects the `gnu++20` spelling (only knows `gnu++2a`). The
; pioarduino fork below BUNDLES arduino-esp32 3.1.3 + GCC 13.2 (has <span>), so it fixes the
; toolchain and the header in one line. 53.03.13 is the version verified to build the Heltec here.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
board = heltec_wifi_lora_32_V3
framework = arduino
; lib_ldf_mode = deep+  (commented out — deep+ tries to compile Arduino framework WiFi/LittleFS
;   from source on this pioarduino fork, which fails. The platform resolves its own includes.)
; ★ §A0 (2026-08-03, spec docs/superpowers/specs/2026-07-31-onboard-oled-ui-design.md §0): board adapters live under
;   variants/. V4-1 extracted the Heltec page-buffer canvas to variants/heltec_common: V3 supplies every hardware trait
;   below and compiles the common TU; future V4 profiles reuse it instead of copying the canvas.
; ★ §UI-6 (plan Task 6) adds +<firmware_ui.cpp>: the board-UI FEATURE layer. It is board-INDEPENDENT (it draws through
;   variants/heltec_common/board_ui.h and never names U8g2), so it lives in src/ and is compiled only where
;   MR_FEAT_OLED=1 — this env and the two that extend it. It DEFINES the mr_ui_* hooks; the common canvas must not.
build_src_filter = +<fw_main.cpp> +<firmware_remote.cpp> +<firmware_config.cpp> +<firmware_inbox.cpp> +<firmware_commands.cpp> -<sim_main.cpp> +<device_ota.cpp> +<firmware_ui.cpp> +<../variants/heltec_common/board_ui.cpp>
upload_protocol = esptool
monitor_speed  = 115200       ; match fw_main Serial.begin(115200)
monitor_dtr    = 0            ; don't reset the board on `pio device monitor` connect (Heltec auto-reset circuit)
; arduino-esp32 appends -std=gnu++17 last on our TUs, overriding gnu++2a (<span>);
; strip it so the framework's gnu++2b (C++23 ⊇ our C++20) wins for lib/core.
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
  ${common.build_flags}
  -DMESHROUTE_NO_TELEMETRY        ; strip the diagnostic emit blocks (MR_TELEMETRY) from the device build
  -DMR_FEAT_OLED=1                ; on-board OLED: compile firmware_ui + the shared Heltec canvas
  ; V4-1: board_ui.h/cpp live together in heltec_common. This include is load-bearing for src/firmware_ui.cpp;
  ; board_ui.cpp itself resolves its quoted headers beside the TU.
  -I variants/heltec_common
  ; Required shared-canvas traits. No value defaults in board_ui_traits.h: a missing board fact is a build failure.
  -DMR_UI_OLED_RST=21
  -DMR_UI_OLED_SCL=18
  -DMR_UI_OLED_SDA=17
  -DMR_UI_OLED_ADDR=0x3C
  -DMR_UI_VEXT_PIN=36
  -DMR_UI_VEXT_ON_LEVEL=LOW       ; V3's proven panel-power level; not a universal Vext polarity claim
  -DMR_UI_BTN_PIN=0               ; §UI-5: Heltec V3/V4 user button. Active LOW, INPUT_PULLUP. ⚠ GPIO0 is the ESP32-S3
                                  ; boot strap pin: held across a reset it enters serial-download mode, so a user
                                  ; holding the emergency long-press through a brownout gets a bricked-looking device
                                  ; (spec §10.1) — a hardware behaviour to document, not one the UI can fix.
                                  ; ⓘ The plan puts this -D in Task 6 Step 1, but Task 5's board TU is what READS it,
                                  ; so it has to land here or the board TU does not compile.
  -DMR_UI_TEAM_CHANNEL_ID=0       ; §UI-6, OWNER RULING: the channel the emergency + the canned posts go to is a BUILD
                                  ; constant — no cfg key, no NV field, no console verb. src/firmware_ui.cpp #errors if
                                  ; it is absent (C2): a defaulted value would silently point a distress call at
                                  ; somebody else's channel. It is also the §4.4 scope test for a distress REPLY.
  ; ★ §UI-9 (plan Task 9): THE BATTERY PINS, AND THEY LANDED WITH THEIR READER — not before it.
  ;   ⛔ CORRECTED IN PLACE 2026-08-06: this block used to say these two were "DELIBERATELY NOT HERE YET" because
  ;   nothing read them until Task 9. Task 9 is now in the tree (heltec_common/board_ui.cpp's battery_sample_mv),
  ;   so the withheld state is over and the note would otherwise contradict the flags directly beneath it (V1).
  ;   The rule it recorded still stands and still earned itself: config landing before its reader is dead config.
  ;   ⓘ board_ui.cpp #errors on the absence of either (C2) — the pins are not defaultable. A wrong ADC input reads a
  ;   different net; a wrong CONTROL pin leaves a divider enabled for ever, a standing drain on a safety device.
  -DMR_UI_ADC_CTRL=37             ; battery-divider CONTROL line (NOT the ADC input). Polarity is AUTO-DETECTED at
                                  ; board_init(), because Heltec inverted it past rev 3.2 while keeping the V3 name —
                                  ; see the polarity block in board_ui.cpp. Provenance: MeshCore HeltecV3Board.h:12.
  -DMR_UI_VBAT_READ=1             ; the ADC input itself (ESP32-S3 ADC1_CH0). Provenance: MeshCore HeltecV3Board.h:9.
  -DMR_UI_ADC_CTRL_STRATEGY=MR_UI_ADC_CTRL_PROBE
  -DMR_UI_ADC_CTRL_FAILSAFE_PARK=LOW
  -DMR_UI_VBAT_ADC_SCALE=5.42f    ; empirical combined ADC scale, not merely the 390k/100k divider ratio
  -DRADIOLIB_GODMODE=1
  -DRADIOLIB_STATIC_ONLY=1
  -DBOARD_HELTEC_V3
  ; control pins -> RadioLib Module(NSS, DIO1, RST, BUSY) ctor
  -DLORA_PIN_NSS=8
  -DLORA_PIN_DIO1=14
  -DLORA_PIN_RST=RADIOLIB_NC
  -DLORA_PIN_BUSY=13
  ; dedicated SPI bus -> std_init(&SPI) (P_LORA_SCLK present => std_init begins it)
  -DP_LORA_SCLK=9
  -DP_LORA_MISO=11
  -DP_LORA_MOSI=10
  ; board/analog wiring -> read by CustomSX1262::std_init
  -DSX126X_DIO2_AS_RF_SWITCH=true
  -DSX126X_DIO3_TCXO_VOLTAGE=1.8
  -DSX126X_CURRENT_LIMIT=140
  -DSX126X_RX_BOOSTED_GAIN=1
; ⚠ THIS BLOCK BELONGS TO [env:heltec_v3]. v1 of it landed in [env:xiao_sx1262] because the insertion
; anchored on the FIRST match of a lib_deps/RadioLib block that appears in SEVERAL env sections — so
; heltec_v3 asked for `Wire` with nothing to resolve it against, and the Windows build kept failing.
; ★ Linux could NOT detect this: its LDF finds Wire by discovery anyway, so the misplacement was invisible
; here. Verify env membership by SECTION, never by line number or first-match.
; ★★ §B94 — MAKE THE FRAMEWORK'S Wire EXPLICITLY DISCOVERABLE. Cross-platform build fix, NOT tidiness.
; U8g2's `U8x8lib.cpp:52` includes <Wire.h> (always — `U8x8lib.h:82-84` defines U8X8_HAVE_HW_I2C
; unconditionally, "Assumption: All Arduino Boards have Wire.h"). On LINUX the LDF finds, compiles and
; links the framework-bundled Wire by itself — MEASURED: `libWire.a` + 32 `TwoWire` symbols in the ELF.
; On the owner's WINDOWS host it does NOT, and the build fails at
;   U8x8lib.cpp:1338: error: 'Wire' was not declared in this scope
; ⚠ RULED OUT BY MEASUREMENT, so nobody re-runs them: a shadowing/registry `Wire` (`lib_deps = Wire`
; resolves to NOTHING and was reverted as provably inert) · version drift (both hosts:
; espressif32 53.3.13 / framework 3.1.3 / toolchain 13.2.0) · a stale LDF cache (a clean `.pio` on
; Windows still failed) · and ⛔ `pio pkg list` output, which lists only RadioLib+U8g2 on BOTH hosts and
; is therefore SILENT about framework built-ins — it is not evidence either way.
; ⇒ this points the LDF at the framework's library storage so `Wire` is resolvable BY NAME instead of by
; discovery. §B96: never spell the package directory here: URL-pinned PlatformIO packages may carry an
; `@src-...` suffix while an obsolete unsuffixed sibling remains installed. The pre-script asks the active
; platform for the framework it actually selected, then adds that framework's Wire sources only.
; ★★★ §B200 — `pre:tools/git_rev.py` IS ADDED HERE, AND THE REASON IS A MEASURED PROVENANCE HOLE, NOT TIDINESS.
; It appeared EXACTLY ONCE in this file (inside [env:xiao_sx1262]), and this env has its own `extra_scripts` and no
; `extends`, so it never injected GIT_REV and fw_main's `#ifndef GIT_REV #define GIT_REV "nogit"` fallback applied.
; ⇒ EVERY Heltec image ever flashed has been unidentifiable from its own banner — and the Heltec boards are the ones
; producing the field faults ([[B196]], [[B199]], [[B200]]). The B200 metal capture reads `nogit` and its
; `firmware.elf` was not retained, so those addresses can never be decoded. `heltec_mobile` and `gateway_heltec`
; `extends = env:heltec_v3` and carry no `extra_scripts` of their own, so this one line covers all three envs.
; ⚠ It changes the BANNER STRING and therefore flash bytes. It changes NO behaviour.
extra_scripts =
  pre:tools/git_rev.py         ; inject -DGIT_REV for the `version` banner (heltec_mobile / gateway_heltec inherit via extends)
  pre:tools/wire_path.py
lib_deps =
  jgromes/RadioLib @ 7.7.1     ; ★ PINNED EXACTLY (2026-07-26 ruling), was ^7.6.0. The caret let different
                               ; checkouts resolve different versions — this tree held a MIX (7.7.1 on 9 envs,
                               ; 7.7.0 on xiao_sx1262/heltec_v3/native), which silently skews any board
                               ; RAM/Flash baseline and invalidated one during the 3-B dedup block. 7.7.1 is
                               ; what the majority of envs and all recent gating/bench work already ran, so this
                               ; freezes proven ground rather than moving to it; it also keeps the newer
                               ; LR1110 support that the T1000-E variant will need. Bump deliberately, never
                               ; by resolution drift.
  Wire                         ; §B96: built from the active framework by pre:tools/wire_path.py above (pins nothing new)
  olikraus/U8g2 @ 2.35.30      ; ★ PINNED EXACTLY (§UI-5) — the SAME rule as the RadioLib pin directly above, for the
                               ; same measured reason: a caret lets different checkouts resolve different versions and
                               ; silently skews this board's RAM/Flash baseline. 2.35.30 verified present in the
                               ; registry (published 2024-09-18); latest is 2.36.18 — bump deliberately, never by
                               ; resolution drift.
                               ; WHY U8g2 and not Adafruit_SSD1306+GFX+BusIO (spec §8): the U8G2_..._1_HW_I2C
                               ; PAGE-BUFFER mode uses a 128 B buffer instead of 1024 B, and its natural draw loop IS
                               ; the 8-page chunking spec §5 requires — a full-frame repaint is ~25 ms of blocking I2C
                               ; against a cts_to_data_gap_ms of 5, so page mode is a correctness requirement here.
                               ; Only heltec_v3 pulls it, plus gateway_heltec / heltec_mobile, which declare no
                               ; lib_deps of their own and so INHERIT this whole list through `extends` (they re-list
                               ; only build_flags). Every other env is untouched.

; ----- Heltec WiFi LoRa 32 V4.2/V4.3 (first flashable base profile) -----
; V4-3 deliberately adds only the base profile. Mobile/gateway derivatives belong to V4-4 after both physical
; revisions pass the metal matrix. The shared OLED canvas and pinned ESP32 toolchain/dependencies come from V3;
; board-specific differences are removed/replaced below instead of copied into a second canvas definition.
[env:heltec_v4]
extends = env:heltec_v3
board = heltec_v4
board_build.variants_dir = arduino_variants
build_src_filter = ${env:heltec_v3.build_src_filter} +<../variants/heltec_v4/board_rf.cpp>
build_unflags =
  ${env:heltec_v3.build_unflags}
  -DBOARD_HELTEC_V3
  -DLORA_PIN_RST=RADIOLIB_NC
  -DLORA_TX_POWER=22
  -DMR_UI_VEXT_ON_LEVEL=LOW
  -DMR_UI_ADC_CTRL_STRATEGY=MR_UI_ADC_CTRL_PROBE
  -DMR_UI_ADC_CTRL_FAILSAFE_PARK=LOW
build_flags =
  ${env:heltec_v3.build_flags}
  -DBOARD_HELTEC_V4
  -DMR_BOARD_RF_FRONTEND=1
  -DLORA_PIN_RST=12
  ; V4 output contract: std_init uses the safe SX1262 drive; runtime config carries nominal conducted output.
  -DLORA_TX_POWER=10
  -DMR_DEFAULT_OUTPUT_DBM=22
  -DMR_RF_OUTPUT_MIN_DBM=22
  -DMR_RF_OUTPUT_MAX_DBM=22
  -DMR_RF_OUTPUT_RANGE_TEXT=\"22\"
  -DMR_RF_FREQ_MIN_MHZ=863.0
  -DMR_RF_FREQ_MAX_MHZ=928.0
  -DMR_RF_FREQ_RANGE_TEXT=\"863..928\"
  -DMR_RF_STRICT_ENVELOPE=1
  ; Runtime-selected external FEM: common LDO/discriminator plus the revision-specific second control.
  -DMR_V4_FEM_LDO_PIN=7
  -DMR_V4_FEM_CSD_PIN=2
  -DMR_V4_GC_TX_EN_PIN=46
  -DMR_V4_KCT_CTX_PIN=5
  -DSX126X_REGISTER_PATCH=1
  ; V4 panel power is active HIGH; its battery divider has a fixed active-HIGH contract (park LOW).
  -DMR_UI_VEXT_ON_LEVEL=HIGH
  -DMR_UI_ADC_CTRL_STRATEGY=MR_UI_ADC_CTRL_FIXED_ACTIVE_HIGH

; ----- Seeed XIAO ESP32-S3 + Wio-SX1262 (B2B-connector kit) -----
; Same radio MODULE as xiao_sx1262 (Wio-SX1262: DIO2 RF switch, 1.8 V TCXO) but on an ESP32-S3 MCU, so it
; reuses heltec_v3's PLATFORM/toolchain (pioarduino espressif32 = arduino-esp32 3.1.3 + GCC 13.2, for <span>/
; C++20) with the XIAO-ESP32S3 board def. PINS are the B2B-connector bottom-pads (raw GPIO, NOT the D0-D10
; header). Verified config: RadioLib Module(41,39,42,40) + setTCXO(1.8) + setDio2AsRfSwitch(true) — see the
; Seeed wiki + RadioLib disc. #1361. Flash: `pio run -e xiao_esp32s3 -t upload`. Not in default_envs.
[env:xiao_esp32s3]
; ★★★ §B213 (2026-08-18) — `pre:tools/git_rev.py` IS ADDED HERE, AND IT CLOSES THE THIRD INSTANCE OF THE SAME HOLE.
; §B200 found that the script appeared EXACTLY ONCE in this file (inside [env:xiao_sx1262]) and added it to
; [env:heltec_v3]. ⛔ IT WAS NEVER ADDED HERE — this is the THIRD base board (no `extends`, and it had no
; `extra_scripts` at all), so fw_main's `#ifndef GIT_REV #define GIT_REV "nogit"` fallback applied and EVERY
; xiao_esp32s3-family image has been unidentifiable from its own banner. METAL-CONFIRMED 2026-08-18:
; `MeshRoute fw v0.2 · built Aug 18 2026 17:41:05 · nogit · board=xiao_esp32s3`.
; `gateway_esp32s3` and `xiao_esp32s3_mobile` `extends = env:xiao_esp32s3` and carry no `extra_scripts` of their own,
; so this one line covers all three envs.
; ⚠ It changes the BANNER STRING and therefore flash bytes. It changes NO behaviour.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
extra_scripts =
  pre:tools/git_rev.py         ; inject -DGIT_REV for the `version` banner (gateway_esp32s3 / xiao_esp32s3_mobile inherit via extends)
; NB no common board_ui.cpp term (§A0): this board sets no -DMR_FEAT_OLED and has no Heltec canvas consumer. An OLED
; on this board would require its own explicit board binding; it must not inherit Heltec traits by accident.
build_src_filter = +<fw_main.cpp> +<firmware_remote.cpp> +<firmware_config.cpp> +<firmware_inbox.cpp> +<firmware_commands.cpp> -<sim_main.cpp> +<device_ota.cpp>
upload_protocol = esptool
monitor_speed  = 115200
monitor_dtr    = 0            ; don't reset on monitor-connect (ESP32-S3 native-USB CDC)
build_unflags = -std=gnu++11 -std=gnu++17   ; let lib/core keep gnu++2a (<span>); same as heltec_v3
build_flags =
  ${common.build_flags}
  -DMESHROUTE_NO_TELEMETRY
  -DRADIOLIB_GODMODE=1
  -DRADIOLIB_STATIC_ONLY=1
  -DBOARD_XIAO_ESP32S3
  ; Wio-SX1262 B2B control pins (raw GPIO of the bottom-pad B2B connector) -> Module(NSS, DIO1, RST, BUSY)
  -DLORA_PIN_NSS=41
  -DLORA_PIN_DIO1=39
  -DLORA_PIN_RST=42
  -DLORA_PIN_BUSY=40
  ; dedicated SPI bus -> std_init(&SPI) begins it (P_LORA_SCLK present => the &SPI path in fw_main)
  -DP_LORA_SCLK=7
  -DP_LORA_MISO=8
  -DP_LORA_MOSI=9
  ; Wio-SX1262 analog wiring (same module as the nRF52 build) -> read by CustomSX1262::std_init
  -DSX126X_DIO2_AS_RF_SWITCH=true
  -DSX126X_DIO3_TCXO_VOLTAGE=1.8
  -DSX126X_CURRENT_LIMIT=140
  -DSX126X_RX_BOOSTED_GAIN=1
  ; ⚠ RF-SWITCH VERIFY-POINT: the verified B2B RadioLib example drives the antenna via DIO2 ONLY (above), so
  ; NO external RXEN is set here. The docs also mention an ANT_SW on GPIO38 — if RX/TX is DEAD on metal, the
  ; fallback is to add `-DSX126X_RXEN=38 -DSX126X_TXEN=RADIOLIB_NC` (the nRF52 build's RXEN+DIO2 pattern) OR
  ; drive GPIO38 HIGH in setup(). Check the Wio-SX1262 schematic. Seeed's own docs are thin here.
lib_deps =
  jgromes/RadioLib @ 7.7.1     ; ★ PINNED EXACTLY (2026-07-26 ruling), was ^7.6.0. The caret let different
                               ; checkouts resolve different versions — this tree held a MIX (7.7.1 on 9 envs,
                               ; 7.7.0 on xiao_sx1262/heltec_v3/native), which silently skews any board
                               ; RAM/Flash baseline and invalidated one during the 3-B dedup block. 7.7.1 is
                               ; what the majority of envs and all recent gating/bench work already ran, so this
                               ; freezes proven ground rather than moving to it; it also keeps the newer
                               ; LR1110 support that the T1000-E variant will need. Bump deliberately, never
                               ; by resolution drift.

; (The old `xiao_node2` env is gone: node_id is no longer a build flag — it comes from NV / join.
;  Flash the SAME xiao_sx1262 build to both boards, then provision each:  cfg set node_id <1..254>  + reboot.)

; ----- Gateway build (dual-layer cross-layer bridge, 2026-06-12-gateway-dual-layer-design.md) -----
; A gateway is NOT a board — it's a BOARD-AGNOSTIC flag delta (below) layered onto ANY device env. A
; gateway is a full citizen of TWO layers on ONE identity (one radio time-multiplexed across the two
; layers — Slice 3+). MR_N_LAYERS=2 allocates a second LayerRuntime (~80 KB), so the build cuts the
; gossip FIFO HARD: a gateway SKIPS the channel gossip plane (Principle 11), so cap_channel_buffer is
; dead weight — dropping 128->8 reclaims ~60 KB across both layers (the dominant cost), cap_deferred_sends
; 32->16 trims more; cap_routes stays FULL (254), no routing sacrifice. The cuts are CORRECTNESS-aligned
; (the buffer is unused on a gateway), so they're right on every board; they're RAM-CRITICAL on the XIAO
; nRF52 (~235 KB -> 73% vs 98.6% with full caps) and free headroom on the ESP32 targets (512 KB + PSRAM).
;
; Compose onto a board with `extends = env:<board>` + `${gateway_flags.build_flags}`. The flags live in
; this shared fragment so every per-board gateway env stays DRY (one source of truth). NB build_flags do
; NOT auto-merge across extends — each env re-lists ${env:<board>.build_flags} ${gateway_flags.build_flags}.
[gateway_flags]
build_flags =
  -DMR_N_LAYERS=2
  -DMR_PROFILE_GATEWAY          ; §featuresplit (2026-07-12): pure static relay + bridge — the team plane compiles OUT (frees ~45 KB of _rt_team ×2). MOBILE/MOBILE_HOST flip off in slices 2/3. See lib/core/mr_features.h + docs/superpowers/specs/2026-07-12-firmware-feature-split.md.
  -DMR_GATEWAY_BUILD=1          ; DEDICATED gateway firmware — on_init REFUSES n_layers<2 (the cap_channel_buffer=8 cut
                               ; is only safe when the channel plane is actually skipped, i.e. n_layers==2). NB:
                               ; the native test env is also MR_N_LAYERS=2 but does NOT define this, so it still runs
                               ; single-layer tests; the refuse is keyed on this build flag, not on MR_N_LAYERS.
  -DMR_CAP_CHANNEL_BUFFER=8     ; gateway skips gossip (Principle 11) — reclaims the second layer's RAM
  -DMR_CAP_DEFERRED_SENDS=16

; nRF52 XIAO gateway — the original; the `gateway` NAME is kept (docs/configuring-a-gateway.md + the
; 3-board gate `pio run -e gateway -e xiao_sx1262 -e heltec_v3` reference it). NOT in default_envs.
[env:gateway]
extends = env:xiao_sx1262
build_flags =
  ${env:xiao_sx1262.build_flags}
  ${gateway_flags.build_flags}

; Heltec WiFi LoRa 32 V3 gateway.
[env:gateway_heltec]
extends = env:heltec_v3
build_flags =
  ${env:heltec_v3.build_flags}
  ${gateway_flags.build_flags}

; Seeed XIAO ESP32-S3 + Wio-SX1262 gateway.
[env:gateway_esp32s3]
extends = env:xiao_esp32s3
build_flags =
  ${env:xiao_esp32s3.build_flags}
  ${gateway_flags.build_flags}

; ----- Production node — USB-CDC console EXCLUDED (BLE/rcmd-managed). USB-CDC reliability spec (2026-06-25) Part 5. -----
; MR_CONSOLE=0 -> `mrcon` is a NullPrint AND the input path (service_console / Serial.begin / the DTR-wait /
; serial_has_input) #if's out -> OUR code references no Serial, so the flood/wedge surface from our own prints is GONE.
; Diagnostics stay OVER THE AIR: the BLE-NUS console + `rcmd` (status/faults/version) + the persistent fault-log.
; -Wno-unused-function: the text-console command handlers are unreferenced in this build (the BLE/JSON path keeps its own).
; ⚠ This does NOT add -DCFG_TUD_CDC=0 (drop the CDC class entirely): the VENDORED CustomSX1262::std_init keeps 2
; Serial.print refs in its radio-init ERROR path (boards/.../CustomSX1262.h — not editable per the vendoring policy),
; and the debug-trace (frame_trace/device_radio) Serial refs are runtime-dead but still compiled. A clean no-CDC link
; needs those handled first; today MR_CONSOLE=0 already removes our always-on console output + the input wedge surface.
; DECISION 2026-06-25 (user): ACCEPT this partial — MR_CONSOLE=0 already kills the flood/wedge surface (the real bug);
; the CDC class stays compiled-but-silent (~a few hundred B RAM, harmless). Full exclusion is DEFERRED, not blocked —
; the path: add a NullPrint `Serial` shim under `#if !CFG_TUD_CDC` so the vendored + dead debug refs resolve, THEN set
; -DCFG_TUD_CDC=0 to drop the class. Revisit only if RAM gets tight. (The documented Part-5 gate exception.)
[env:production]
extends = env:xiao_sx1262
build_flags =
  ${env:xiao_sx1262.build_flags}
  -DMR_CONSOLE=0
  -Wno-unused-function

; ----- Mobile-ROLE builds (spec 2026-07-13 §10). Same hardware as the base board, but flashed onto a roaming
; personal endpoint (a hiker): MR_PROFILE_MOBILE => MR_FEAT_REMOTE_MGMT=0 — sheds the remote-command + admin-auth
; subsystem (a mobile is managed LOCALLY via the companion/BLE, and is the most physically-capturable node). The role
; is a DISTINCT env, NOT the base board — so `production` (static, KEEPS remote-mgmt) and the gateways (KEEP it) are
; unaffected. Flash `*_mobile` for mobiles; `xiao_sx1262`/`heltec_v3`/`xiao_esp32s3` stay the full/base builds.
[env:xiao_mobile]
extends = env:xiao_sx1262
build_flags =
  ${env:xiao_sx1262.build_flags}
  -DMR_PROFILE_MOBILE

[env:heltec_mobile]
extends = env:heltec_v3
build_flags =
  ${env:heltec_v3.build_flags}
  -DMR_PROFILE_MOBILE

[env:xiao_esp32s3_mobile]
extends = env:xiao_esp32s3
build_flags =
  ${env:xiao_esp32s3.build_flags}
  -DMR_PROFILE_MOBILE
